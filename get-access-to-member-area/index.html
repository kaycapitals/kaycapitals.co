<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get Access To Members Area</title>
  <meta name="description" content="Get Access To The Kay Capitals University Members Area">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/x-icon" href="https://statics.myclickfunnels.com/image/444277/file/93a4faf7cc71cc7525a3c23d60484ff2.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100vh;
      font-family: 'Open Sans', sans-serif;
      color: #1a1a1a;
    }

    body {
      background: linear-gradient(145deg, #dce3e9 0%, #cdd5dc 20%, #bec8d1 45%, #d0d8e0 65%, #e2e7eb 85%, #f0f2f4 100%);
      background-attachment: fixed;
    }

    .page-wrapper {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      padding: 52px 24px 60px;
    }

    /* Main headline */
    h1.page-title {
      font-family: 'Open Sans', sans-serif;
      font-weight: 800;
      font-size: clamp(2rem, 6vw, 3.2rem);
      text-align: center;
      color: #111;
      margin-bottom: 18px;
      line-height: 1.1;
    }

    /* Subtext */
    .subtext {
      font-family: 'Open Sans', sans-serif;
      font-weight: 400;
      font-size: clamp(0.88rem, 2vw, 1rem);
      text-align: center;
      color: #333;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .subtext a {
      color: #1a5fcc;
      text-decoration: none;
    }

    .subtext a:hover {
      text-decoration: underline;
    }

    /* Mid headline */
    h2.mid-headline {
      font-family: 'Open Sans', sans-serif;
      font-weight: 800;
      font-size: clamp(1rem, 2.8vw, 1.4rem);
      text-align: center;
      color: #111;
      margin-bottom: 14px;
      line-height: 1.4;
    }

    /* Divider */
    hr.divider {
      border: none;
      border-top: 1px solid rgba(0,0,0,0.2);
      margin: 0 0 28px;
    }

    /* Video */
    .video-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
      margin-bottom: 28px;
    }

    .video-container iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: 0;
    }

    /* Bottom dividers */
    .bottom-dividers {
      margin-top: 8px;
    }

    .bottom-dividers hr {
      border: none;
      border-top: 1px solid rgba(0,0,0,0.18);
      margin: 8px 0;
    }

    /* Button */
    .btn-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .btn-red {
      display: inline-block;
      background: #e80000;
      color: #fff;
      font-family: 'Open Sans', sans-serif;
      font-weight: 700;
      font-size: 0.88rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 14px 36px;
      border-radius: 400px;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
      text-align: center;
    }

    .btn-red:hover { background: #b80000; }

    @media (max-width: 600px) {
      h1.page-title { font-size: 1.8rem; }
      h2.mid-headline { font-size: 1rem; }
      .btn-red { font-size: 0.82rem; padding: 12px 28px; }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">

    <!-- Title -->
    <h1 class="page-title">Get Access To Members Area</h1>

    <!-- Subtext -->
    <p class="subtext">
      If you fall off anywhere in the process, just throw me a message on
      <a href="https://www.instagram.com/someshtrades/" target="_blank" rel="noopener noreferrer">Instagram</a>
      and I can help you out.
    </p>

    <!-- Mid headline -->
    <h2 class="mid-headline">Watch This Quick Little Video on HOW To Get Access To The Course Materials</h2>

    <hr class="divider">

    <!-- Wistia Video -->
    <div class="video-container">
      <iframe
        src="//fast.wistia.net/embed/iframe/v8ymf166ru?autoplay=0&wmode=transparent"
        allowtransparency="true"
        scrolling="no"
        allowfullscreen
        mozallowfullscreen
        webkitallowfullscreen
        oallowfullscreen
        msallowfullscreen
        wmode="opaque"
        title="Get Access To Members Area">
      </iframe>
    </div>

    <!-- Sign In Button -->
    <div class="btn-wrap">
      <a class="btn-red" href="https://kaycapitals.thinkific.com/users/sign_in" target="_blank" rel="noopener noreferrer">Sign In</a>
    </div>

    <!-- Bottom dividers (matches original) -->
    <div class="bottom-dividers">
      <hr>
      <hr>
      <hr>
      <hr>
    </div>

  </div>
</body>
</html>
