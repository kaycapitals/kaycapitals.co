<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Invitation</title>

  <!-- Block all search engines -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: linear-gradient(145deg, #e8e8e8 0%, #f5f5f5 50%, #e0e0e0 100%);
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 640px;
      margin: 40px 20px 0;
      padding: 44px 32px 36px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow:
        0 4px 6px rgba(0, 0, 0, 0.04),
        0 12px 28px rgba(0, 0, 0, 0.08),
        0 24px 56px rgba(0, 0, 0, 0.06);
      flex: 0 1 auto;
    }

    h1 {
      text-align: center;
      font-size: 1.65rem;
      font-weight: 800;
      margin-bottom: 28px;
      line-height: 1.3;
    }

    .video-wrap {
      position: relative;
      width: 100%;
      border: 2px solid #1a1a1a;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
      box-shadow:
        0 6px 20px rgba(0, 0, 0, 0.15),
        0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .video-wrap .wistia_embed { width: 100%; }

    /* Mobile-only unmute prompt */
    .unmute-prompt {
      display: none;
      text-align: center;
      margin-top: 16px;
      padding: 12px 24px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #1a1a1a;
      background: #f0f0f0;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .unmute-prompt:active {
      transform: scale(0.97);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }

    .unmute-prompt .arrow {
      display: block;
      font-size: 1.4rem;
      line-height: 1;
      margin-bottom: 2px;
      animation: bounce 1.2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @media (max-width: 768px) {
      .unmute-prompt { display: block; }
      .card { margin: 24px 14px 0; padding: 32px 20px 28px; border-radius: 14px; }
    }

    .cta-text {
      text-align: center;
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.55;
      margin-top: 28px;
      padding: 0 6px;
      color: #2a2a2a;
    }

    footer {
      text-align: center;
      padding: 32px 20px 28px;
      font-size: 0.85rem;
      color: #999;
    }

    footer a {
      color: #999;
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover { color: #555; }
  </style>

  <!-- Wistia async embed -->
  <script src="https://fast.wistia.com/embed/medias/la87s9o5xv.jsonp" async></script>
  <script src="https://fast.wistia.com/assets/external/E-v1.js" async></script>
</head>
<body>

  <div class="card">
    <h1>Watch This Short Video Now 🔥</h1>

    <div class="video-wrap">
      <div class="wistia_responsive_padding" style="padding:56.25% 0 0 0;position:relative;">
        <div class="wistia_responsive_wrapper" style="height:100%;left:0;position:absolute;top:0;width:100%;">
          <div class="wistia_embed wistia_async_la87s9o5xv seo=false videoFoam=true autoPlay=true silentAutoPlay=allow"
               style="height:100%;position:relative;width:100%;">
          </div>
        </div>
      </div>
    </div>

    <div class="unmute-prompt" id="unmutePrompt" onclick="unmuteVideo()">
      <span class="arrow">☝️</span>
      Click here to Unmute!
    </div>

    <p class="cta-text">
      Watch this video to the end. Then go back to our chat where we were talking and let me know if you're IN, out or have any questions 💪
    </p>
  </div>

  <footer>
    © 2026 - <a href="http://www.instagram.com/kaycapitals" target="_blank" rel="noopener">@kaycapitals</a>
  </footer>

  <script>
    function unmuteVideo() {
      window._wq = window._wq || [];
      _wq.push({ id: 'la87s9o5xv', onReady: function(video) {
        video.unmute();
        video.play();
      }});
      document.getElementById('unmutePrompt').style.display = 'none';
    }
  </script>

</body>
</html>
